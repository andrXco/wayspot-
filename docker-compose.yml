services:
  postgres:
    image: postgres:16
    container_name: wayspot-postgres
    environment:
      POSTGRES_DB: wayspot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Simon1213
    ports:
      # 5432 ya está ocupado en el equipo; PostgreSQL sigue escuchando en 5432
      # dentro del contenedor y se expone como 5433 para el host.
      - "5433:5432"
    volumes:
      - wayspot-postgres-data:/var/lib/postgresql/data

volumes:
  wayspot-postgres-data:
